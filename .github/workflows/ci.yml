name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Same development-only credentials as docker-compose.yml and .env.example.
      # scripts/local-test.env holds the same endpoints for local runs; CI sets
      # its own so a missing value here fails the run instead of being filled in.
      DATABASE_URL: postgresql://auction:auction_local@localhost:5432/auction_db?sslmode=disable
      TEST_DATABASE_URL: postgresql://auction:auction_local@localhost:5432/auction_db
      TEST_KAFKA_BROKERS: localhost:9092
      TEST_KAFKA_FAULT_INJECTION_UPSTREAM: localhost:19093
      TEST_VALKEY_NODES: localhost:7001,localhost:7002,localhost:7003
      # A second cluster for tests that change the topology, so they cannot
      # disturb the tests that share TEST_VALKEY_NODES.
      TEST_VALKEY_TOPOLOGY_NODES: localhost:7101,localhost:7102,localhost:7103
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Started first so the broker and cluster boot while dependencies install.
      - name: Start PostgreSQL, Kafka and Valkey
        run: >-
          docker compose up --detach postgres kafka valkey-1 valkey-2 valkey-3
          valkey-topology-1 valkey-topology-2 valkey-topology-3 valkey-topology-4 valkey-topology-5 valkey-topology-6

      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The load tool is Go; its version comes from tools/loadgen/go.mod.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/loadgen/go.mod
          cache-dependency-path: tools/loadgen/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # librdkafka is a prebuilt binary downloaded by an install script;
      # fail here, not deep inside a Kafka test, if it did not arrive.
      - name: Load the native Kafka client
        working-directory: services/auction-service
        run: >
          node --input-type=module --eval
          'const { default: kafka } = await import("@confluentinc/kafka-javascript");
          if (!kafka.librdkafkaVersion) throw new Error("librdkafka binding did not load");
          console.log(`librdkafka ${kafka.librdkafkaVersion}`);'

      - name: Wait for infrastructure, topic provisioning and cluster formation
        run: |
          docker compose up --detach --wait postgres kafka valkey-1 valkey-2 valkey-3 \
            valkey-topology-1 valkey-topology-2 valkey-topology-3 valkey-topology-4 valkey-topology-5 valkey-topology-6
          # The init services are one-shot: wait for each to exit and require
          # success.
          for init in kafka-init valkey-init valkey-topology-init; do
            docker compose up --detach "$init"
            exit_code="$(docker wait "$(docker compose ps --all --quiet "$init")")"
            docker compose logs --no-color "$init"
            if [ "$exit_code" != "0" ]; then
              echo "::error::$init exited with code $exit_code"
              exit 1
            fi
          done
          # The outage test runs its own proxy on the port the broker's
          # FAULT_INJECTION listener advertises.
          if ss --listening --tcp --numeric | grep --quiet ':19092 '; then
            echo "::error::port 19092 is in use; the Kafka outage test needs it"
            exit 1
          fi

      # Migrating regenerates db/schema.sql with pg_dump from the postgres
      # container. The version header lines depend on which pg_dump build the
      # committer used, so only they are ignored.
      - name: Apply migrations and check db/schema.sql for drift
        run: |
          PATH="$PWD/scripts/compose-bin:$PATH" pnpm db:migrate
          if ! git diff --exit-code --ignore-matching-lines='^-- Dumped (from|by) ' -- db/schema.sql; then
            echo "::error file=db/schema.sql::db/schema.sql differs from the migrated schema; run pnpm db:migrate and commit the result"
            exit 1
          fi

      # The hermetic gate: format, lint, typecheck, unit tests with their
      # coverage thresholds, and the production build. It needs no
      # infrastructure.
      - name: Format, lint, typecheck, unit tests and build
        run: pnpm check

      # The integration and end-to-end Vitest configurations refuse to start
      # when a TEST_* variable is missing, so neither tier can be skipped
      # silently. Separate steps make a failure name its tier.
      - name: Integration tests
        run: pnpm test:integration

      - name: End-to-end tests
        run: pnpm test:e2e

      # The Go load tool has its own gate. Its integration tests refuse to
      # start when a TEST_* variable is missing, like the other tiers.
      - name: Load tool checks
        run: pnpm loadgen:check

      - name: Load tool integration tests
        run: pnpm loadgen:test:integration

      - name: Print infrastructure diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps postgres kafka kafka-init \
            valkey-1 valkey-2 valkey-3 valkey-init \
            valkey-topology-1 valkey-topology-2 valkey-topology-3 valkey-topology-4 valkey-topology-5 valkey-topology-6 valkey-topology-init
