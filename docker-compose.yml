# Shared by the three Valkey cluster nodes, which differ only in port.
#
# Each node listens on the same port inside its container and on the host, and
# announces the hostname "localhost" to clients. Host processes (services
# started with pnpm, integration tests) can then follow the endpoints in
# CLUSTER SHARDS replies and MOVED redirects. The cluster bus between nodes
# still uses container IPs. Containers cannot use the announced endpoints;
# that needs a separate announcement once services run in Compose.
x-valkey-node: &valkey-node
  image: valkey/valkey:9.0.6
  command:
    - /bin/sh
    - -c
    # Development only: no password, and protected mode off so the host can
    # connect through the published port.
    - >-
      exec valkey-server
      --port "$${VALKEY_PORT}"
      --cluster-enabled yes
      --cluster-announce-hostname localhost
      --cluster-preferred-endpoint-type hostname
      --cluster-node-timeout 5000
      --save ""
      --appendonly no
      --protected-mode no
  healthcheck:
    test: ["CMD-SHELL", 'valkey-cli -p "$${VALKEY_PORT}" ping | grep -q PONG']
    interval: 2s
    timeout: 3s
    retries: 15
  # Cluster membership lives in nodes.conf. Keeping it in memory means a
  # recreated or restarted node starts blank, and valkey-init rebuilds the
  # whole cluster instead of reconciling stale addresses.
  tmpfs:
    - /data

# One-shot cluster formation, shared by the clusters below. The nodes to form
# come from the NODES environment variable of each service, and REPLICAS says
# how many replicas each primary gets (default 0; valkey-cli assigns the
# first nodes in the list as primaries). If they already form one healthy
# cluster covering every slot, it changes nothing. Otherwise
# (first start, or a node restarted blank) it resets all of them and creates
# the cluster again. That discards subscriptions, which clients must survive
# anyway.
x-valkey-init: &valkey-init
  image: valkey/valkey:9.0.6
  entrypoint: ["/bin/sh", "-c"]
  command:
    - |
      set -eu
      nodes="$$NODES"
      first="$${nodes%% *}"
      expected="$$(echo "$$nodes" | wc -w | tr -d ' ')"
      healthy=true
      for node in $$nodes; do
        info="$$(valkey-cli -h "$${node%:*}" -p "$${node#*:}" cluster info)"
        echo "$$info" | grep -q '^cluster_state:ok' || healthy=false
        echo "$$info" | grep -q "^cluster_known_nodes:$$expected" || healthy=false
        echo "$$info" | grep -q '^cluster_slots_assigned:16384' || healthy=false
      done
      if [ "$$healthy" = true ]; then
        echo "Valkey cluster already formed"
      else
        addresses=""
        for node in $$nodes; do
          host="$${node%:*}"
          port="$${node#*:}"
          valkey-cli -h "$$host" -p "$$port" flushall > /dev/null
          valkey-cli -h "$$host" -p "$$port" cluster reset hard > /dev/null
          # valkey-cli --cluster create expects addresses, not hostnames.
          addresses="$$addresses $$(getent hosts "$$host" | cut -d ' ' -f 1):$$port"
        done
        valkey-cli --cluster create $$addresses --cluster-replicas "$${REPLICAS:-0}" --cluster-yes
      fi
      until valkey-cli -h "$${first%:*}" -p "$${first#*:}" cluster info | grep -q '^cluster_state:ok'; do
        sleep 1
      done
      valkey-cli -h "$${first%:*}" -p "$${first#*:}" cluster shards
  restart: "no"

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: auction_db
      POSTGRES_USER: auction # local user for development, not used in production
      POSTGRES_PASSWORD: auction_local # local password for development, not used in production
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      # PostgreSQL 18 stores PGDATA below a major-version-specific directory.
      # Mount the parent directory as required by the official image.
      - postgres18_data:/var/lib/postgresql

  kafka:
    image: apache/kafka:4.3.1
    environment:
      # Single combined broker/controller node in KRaft mode (no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Containers reach the broker as kafka:29092; host processes (services
      # started with pnpm, integration tests) use localhost:9092.
      #
      # FAULT_INJECTION is a test-only listener. The broker accepts it on
      # container port 19093 (published as localhost:19093) but advertises
      # localhost:19092, where an integration test runs a TCP proxy. Clients
      # bootstrapped through the proxy are told to keep using the proxy, so the
      # test can cut and restore every broker connection. A proxy in front of
      # PLAINTEXT_HOST would be bypassed after the first metadata response.
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092,FAULT_INJECTION://:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092,FAULT_INJECTION://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,FAULT_INJECTION:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Fixed local-only cluster ID so the persisted log directory can be reused.
      CLUSTER_ID: AGesiUE5QYaSe28NuBc3cg
      # Topics are provisioned explicitly by kafka-init. A typo in a topic name
      # must fail loudly instead of silently creating a one-partition topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # A single broker can only host one replica of anything.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
      - "19093:19093"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    volumes:
      - kafka43_data:/var/lib/kafka/data

  # One-shot topic provisioning. `--if-not-exists` makes it safe to rerun; it
  # does not change the partition count of an existing topic.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic auction.events --partitions 12 --replication-factor 1
        --config min.insync.replicas=1 --config cleanup.policy=delete --config retention.ms=604800000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic auction.events
    restart: "no"

  # Valkey runs in cluster mode from the start: the realtime gateway reads
  # CLUSTER SHARDS to route sharded subscriptions, and slot migration needs a
  # second primary to move to. Three primaries, no replicas, no persistence:
  # the bus carries only pub/sub traffic, so there is nothing to keep.
  valkey-1:
    <<: *valkey-node
    environment:
      VALKEY_PORT: 7001
    ports:
      - "7001:7001"

  valkey-2:
    <<: *valkey-node
    environment:
      VALKEY_PORT: 7002
    ports:
      - "7002:7002"

  valkey-3:
    <<: *valkey-node
    environment:
      VALKEY_PORT: 7003
    ports:
      - "7003:7003"

  # Forms the cluster the integration tests share. Every test that publishes or
  # subscribes uses it, so nothing may change its slot ownership.
  valkey-init:
    <<: *valkey-init
    environment:
      NODES: "valkey-1:7001 valkey-2:7002 valkey-3:7003"
    depends_on:
      valkey-1:
        condition: service_healthy
      valkey-2:
        condition: service_healthy
      valkey-3:
        condition: service_healthy

  # A second cluster for tests that change the topology (moving a slot, failing
  # over a primary). Only those tests connect to it, so what they do cannot
  # disturb the shared cluster or its tests. Same image and settings; three
  # primaries, each with one replica.
  valkey-topology-1:
    <<: *valkey-node
    environment:
      VALKEY_PORT: 7101
    ports:
      - "7101:7101"

  valkey-topology-2:
    <<: *valkey-node
    environment:
      VALKEY_PORT: 7102
    ports:
      - "7102:7102"

  valkey-topology-3:
    <<: *valkey-node
    environment:
      VALKEY_PORT: 7103
    ports:
      - "7103:7103"

  # Replicas of the three topology primaries, for failover tests. valkey-cli
  # makes the first three nodes of NODES the primaries, so these must stay at
  # the end of the list.
  valkey-topology-4:
    <<: *valkey-node
    environment:
      VALKEY_PORT: 7104
    ports:
      - "7104:7104"

  valkey-topology-5:
    <<: *valkey-node
    environment:
      VALKEY_PORT: 7105
    ports:
      - "7105:7105"

  valkey-topology-6:
    <<: *valkey-node
    environment:
      VALKEY_PORT: 7106
    ports:
      - "7106:7106"

  valkey-topology-init:
    <<: *valkey-init
    environment:
      NODES: "valkey-topology-1:7101 valkey-topology-2:7102 valkey-topology-3:7103 valkey-topology-4:7104 valkey-topology-5:7105 valkey-topology-6:7106"
      REPLICAS: "1"
    depends_on:
      valkey-topology-1:
        condition: service_healthy
      valkey-topology-2:
        condition: service_healthy
      valkey-topology-3:
        condition: service_healthy
      valkey-topology-4:
        condition: service_healthy
      valkey-topology-5:
        condition: service_healthy
      valkey-topology-6:
        condition: service_healthy

volumes:
  postgres18_data:
  kafka43_data:
